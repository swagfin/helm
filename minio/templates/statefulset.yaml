apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: {{ .Release.Name }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      terminationGracePeriodSeconds: 30
      {{- if not .Values.useHostStorage }}
      securityContext:
        # Give the application group write access to its PVC.
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
      {{- end }}
      affinity:
        # Keep the configured node placement for this release.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.hostNode }}

      #allow pod to be scheduled even if node is not schedulable
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

      containers:
      - name: minio
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        command:
          - "silo"
          - "server"
          - "--console-address"
          - ":9090"
          - "/data"
        ports:
        - name: api
          containerPort: 9000
          {{- if gt (int .Values.hostPort.api) 0 }}
          hostPort: {{ .Values.hostPort.api }} # on the node's IP
          {{- end }}
        - name: console
          containerPort: 9090
          {{- if gt (int .Values.hostPort.console) 0 }}
          hostPort: {{ .Values.hostPort.console }} # on the node's IP
          {{- end }}
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.MINIO_ROOT_USER | quote }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ required "Set MINIO_ROOT_PASSWORD in your private values file" .Values.MINIO_ROOT_PASSWORD | quote }}
{{- if .Values.serverHost }}
#External server URL for API calls
        - name: MINIO_SERVER_URL
          value: https://{{ .Values.serverHost }}
{{- end }}
{{- if .Values.consoleHost }}
#External URL for the MinIO Console
        - name: MINIO_BROWSER_REDIRECT_URL
          value: https://{{ .Values.consoleHost }}
{{- end }}

#readiness probe
        readinessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 15
          timeoutSeconds: 10

#volume mounts
        volumeMounts:
        - name: minio-data
          mountPath: /data

      volumes:
      - name: minio-data
        {{- if .Values.useHostStorage }}
        hostPath:
          path: {{ printf "%s/%s" (trimSuffix "/" (required "useHostStoragePath is required when useHostStorage is true" .Values.useHostStoragePath)) .Release.Name | quote }}
        {{- else }}
        persistentVolumeClaim:
          claimName: "minio-data"
        {{- end }}

---
#Prevent provisoning more than 1 pod (to Other Nodes, guarantees thats only the one specified)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: max-pod-limit
  namespace: {{ .Release.Name }}
spec:
  hard:
    pods: 1
