{{- if .Values.domain }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.domain }}
  namespace: {{ .Values.namespace | quote }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- if .Values.useLetsEncrypt }}
    cert-manager.io/cluster-issuer: "letsencrypt"
    {{- end }}
spec:
  ingressClassName: "public"
  {{- if .Values.useLetsEncrypt }}
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: {{ printf "%s-tls" (replace "." "-" .Values.domain) }}
  {{- end }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: default-landing-zone
                port:
                  number: 80
{{- end }}
