# Shared with Love by George
name: Validate charts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Build dependencies, lint, and render
        shell: bash
        run: |
          set -euo pipefail
          helm repo add longhorn https://charts.longhorn.io
          helm dependency build ./longhorn_storage
          for chart in longhorn_storage mssql default-landing-zone semantic-backup minio redis redis-distributed; do
            args=()
            case "$chart" in
              mssql) args+=(--set-string 'MSSQL_SA_PASSWORD=ValidationOnly-Password42!') ;;
              minio) args+=(--set-string 'MINIO_ROOT_PASSWORD=ValidationOnly-Password42!') ;;
            esac
            helm lint "./$chart" "${args[@]}"
            helm template validation "./$chart" "${args[@]}" > /dev/null
          done
