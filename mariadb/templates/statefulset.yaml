apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: {{ .Release.Name }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      terminationGracePeriodSeconds: 30
      {{- if not .Values.useHostStorage }}
      securityContext:
        # Give the application group write access to its PVC.
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
      {{- end }}
      affinity:
        # Keep the configured node placement for this release.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.hostNode }}

      #allow pod to be scheduled even if node is not schedulable
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

      containers:
      - name: mariadb
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: tcp
          containerPort: 3306
          {{- if gt (int .Values.hostPort) 0 }}
          hostPort: {{ .Values.hostPort }} # on the node's IP
          {{- end }}

        env:
        - name: MYSQL_ROOT_PASSWORD
          value: {{ required "Set MYSQL_ROOT_PASSWORD in your private values file" .Values.MYSQL_ROOT_PASSWORD | quote }}

#readiness probe
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 15
          timeoutSeconds: 10

#volume mounts
        volumeMounts:
        - name: volume-for-data
          mountPath: /var/lib/mysql

      volumes:
        - name: volume-for-data
          {{- if .Values.useHostStorage }}
          hostPath:
            path: {{ printf "%s/%s" (trimSuffix "/" (required "useHostStoragePath is required when useHostStorage is true" .Values.useHostStoragePath)) .Release.Name | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: "mariadb-data"
          {{- end }}

---
#Prevent provisoning more than 1 pod (to Other Nodes, guarantees thats only the one specified)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: max-pod-limit
  namespace: {{ .Release.Name }}
spec:
  hard:
    pods: 1
