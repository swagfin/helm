apiVersion: "storage.k8s.io/v1"
kind: "StorageClass"
metadata:
  name: {{ .Values.storageClass.name | quote }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    argocd.argoproj.io/sync-options: "Prune=false,Delete=false"
provisioner: "driver.longhorn.io"
allowVolumeExpansion: true
reclaimPolicy: "Retain"
volumeBindingMode: "Immediate"
parameters:
  numberOfReplicas: {{ .Values.storageClass.numberOfReplicas | quote }}
  fsType: "ext4"
  dataEngine: "v1"
  dataLocality: "disabled"
  nodeSelector: {{ .Values.storageNodeTag | quote }}
  diskSelector: {{ .Values.storageDiskTag | quote }}
  replicaSoftAntiAffinity: "disabled"
  replicaZoneSoftAntiAffinity: "enabled"
