{{- if .Values.domain }}
{{- $username := required "Set basicAuth.username before enabling domain" .Values.basicAuth.username }}
{{- $password := required "Set basicAuth.password before enabling domain" .Values.basicAuth.password }}
{{- if regexMatch "[:\\r\\n]" $username }}
{{- fail "basicAuth.username cannot contain colons or newlines" }}
{{- end }}
{{- if gt (len $password) 72 }}
{{- fail "basicAuth.password must be at most 72 bytes for bcrypt" }}
{{- end }}
apiVersion: "v1"
kind: "Secret"
metadata:
  name: {{ printf "%s-ui-auth" .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
type: "Opaque"
data:
  auth: {{ htpasswd $username $password | b64enc | quote }}
{{- end }}
